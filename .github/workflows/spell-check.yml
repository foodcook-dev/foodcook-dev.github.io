name: Korean Spell Check

# PR이 열리거나 코드가 추가로 푸시될 때 자동으로 실행됩니다.
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  spell_check:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 코드를 읽어올 권한
      pull-requests: write # PR에 댓글을 달 권한

    steps:
      - name: 1. 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 변경된 마크다운 파일 찾기
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          # 🚨 [수정 1] 여러 줄로 작성해서 .md와 .markdown 모두 잡아내기
          files: |
            **/*.md
            **/*.markdown

      - name: 3. Node.js 환경 세팅
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 4. 맞춤법 검사기(hanspell) 설치
        if: steps.changed-files.outputs.any_changed == 'true'
        # 🚨 [수정 2] 설치할 패키지 이름은 'hanspell-cli'가 아니라 'hanspell'이야!
        run: npm install -g hanspell

      - name: 5. 맞춤법 검사 실행 및 결과 정리
        if: steps.changed-files.outputs.any_changed == 'true'
        id: run_spellcheck
        run: |
          REPORT="### 📝 마인드쿡 맞춤법 검사 봇\n\n"

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            REPORT+="#### 📄 \`$file\`\n"
            
            # 🚨 [수정 3] cat으로 파일을 읽어서 파이프(|)로 넘겨주기
            RESULT=$(cat "$file" | hanspell-cli 2>&1 || true)
            
            if [ -z "$RESULT" ]; then
              REPORT+="✨ 완벽합니다! 맞춤법 오류가 없습니다.\n\n"
            else
              REPORT+="\n\`\`\`text\n$RESULT\n\`\`\`\n\n"
            fi
          done

          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo -e "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 6. PR에 결과 댓글(Comment) 달기
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: spell-check
          message: ${{ steps.run_spellcheck.outputs.report }}
