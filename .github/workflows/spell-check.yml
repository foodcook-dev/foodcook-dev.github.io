name: Korean Spell Check

# PR이 열리거나 코드가 추가로 푸시될 때 자동으로 실행됩니다.
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  spell_check:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 코드를 읽어올 권한
      pull-requests: write # PR에 댓글을 달 권한

    steps:
      - name: 1. 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 변경된 마크다운 파일 찾기
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          quotepath: false
          # 🚨 [수정!] 여러 줄 대신 중괄호를 써서 한 줄로 깔끔하게 묶었어.
          files: "**/*.{md,markdown}"

      # 🚨 [추가!] 진짜로 파일을 감지했는지 눈으로 확인하기 위한 디버그 스텝
      - name: 2-1. [디버그] 감지된 파일 목록 확인
        run: |
          echo "감지된 마크다운 파일들: ${{ steps.changed-files.outputs.all_changed_files }}"
          echo "변경 여부(true/false): ${{ steps.changed-files.outputs.any_changed }}"

      - name: 3. Node.js 환경 세팅
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 4. 맞춤법 검사기(hanspell) 설치
        if: steps.changed-files.outputs.any_changed == 'true'
        # 🚨 [수정 2] 설치할 패키지 이름은 'hanspell-cli'가 아니라 'hanspell'이야!
        run: npm install -g hanspell

      - name: 5. 맞춤법 검사 실행 및 결과 정리
        if: steps.changed-files.outputs.any_changed == 'true'
        id: run_spellcheck
        run: |
          # 🚨 [추가] 터미널 색상 코드가 마크다운에 섞여서 깨지는 것을 방지합니다.
          export FORCE_COLOR=0 

          REPORT="### 📝 마인드쿡 맞춤법 검사 결과\n\n"
          HAS_ERROR=false

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            
            # 🚨 [핵심 변경] 
            # 1. grep " -> " : 구구절절한 설명 다 버리고 'A -> B' 형태의 줄만 빼옵니다.
            # 2. awk '!seen[$0]++' : 똑같은 단어를 여러 번 틀렸을 경우 한 번만 나오게 중복을 제거합니다.
            # 3. sed 's/^/- /' : 앞에 마크다운 글머리 기호(-)를 붙여서 예쁜 리스트로 만듭니다.
            RESULT=$(cat "$file" | hanspell-cli 2>&1 | grep " -> " | awk '!seen[$0]++' | sed 's/^/- /' || true)
            
            if [ -n "$RESULT" ]; then
              HAS_ERROR=true
              REPORT+="#### 📄 \`$file\`\n"
              REPORT+="$RESULT\n\n"
            fi
          done

          if [ "$HAS_ERROR" = false ]; then
            REPORT+="✨ 완벽합니다! 수정된 파일에 맞춤법 오류가 없습니다.\n\n"
          fi

          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo -e "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 6. PR에 결과 댓글(Comment) 달기
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: spell-check
          message: ${{ steps.run_spellcheck.outputs.report }}
