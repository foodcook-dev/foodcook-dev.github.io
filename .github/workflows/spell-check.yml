name: Korean Spell Check

# PR이 열리거나 코드가 추가로 푸시될 때 자동으로 실행됩니다.
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  spell_check:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 코드를 읽어올 권한
      pull-requests: write # PR에 댓글을 달 권한

    steps:
      - name: 1. 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 🚨 [핵심!] 이전 커밋 기록까지 전부 가져와서 '변경된 파일'을 완벽하게 찾아냅니다.

      - name: 2. 변경된 마크다운 파일 찾기
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: "**/*.md" # 🚨 [변경!] 폴더 상관없이 확장자가 .md인 파일이 수정되면 무조건 잡습니다.

      - name: 3. Node.js 환경 세팅
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 4. 맞춤법 검사기(hanspell-cli) 설치
        if: steps.changed-files.outputs.any_changed == 'true'
        run: npm install -g hanspell-cli

      - name: 5. 맞춤법 검사 실행 및 결과 정리
        if: steps.changed-files.outputs.any_changed == 'true'
        id: run_spellcheck
        run: |
          REPORT="### 📝 마인드쿡 맞춤법 검사 봇\n\n"

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            REPORT+="#### 📄 \`$file\`\n"
            
            # 검사 실행 (터미널 출력값을 모두 캡처합니다)
            RESULT=$(hanspell-cli -d "$file" 2>&1 || true)
            
            if [ -z "$RESULT" ]; then
              REPORT+="✨ 완벽합니다! 맞춤법 오류가 없습니다.\n\n"
            else
              REPORT+="\n\`\`\`text\n$RESULT\n\`\`\`\n\n"
            fi
          done

          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo -e "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 6. PR에 결과 댓글(Comment) 달기
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: spell-check
          message: ${{ steps.run_spellcheck.outputs.report }}
